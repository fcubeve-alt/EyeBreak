name: EyeBreak

options:
  bundleIdPrefix: com.eyebreak
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""        # ← 填入你的 Apple Developer Team ID
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

configs:
  Debug:   debug
  Release: release

targets:

  # ─── 主 App ──────────────────────────────────────────────────────────────────
  EyeBreak:
    type: application
    platform: iOS
    sources:
      - path: EyeBreak
        excludes: ["**/*.entitlements"]
      - path: Shared
    entitlements:
      path: EyeBreak/EyeBreak.entitlements
    info:
      path: EyeBreak/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eyebreak.app
        INFOPLIST_FILE: EyeBreak/Info.plist
        CODE_SIGN_ENTITLEMENTS: EyeBreak/EyeBreak.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: DeviceActivityReport
        embed: true
      - target: DeviceActivityMonitor
        embed: true
      - target: ShieldConfiguration
        embed: true
      - target: ShieldAction
        embed: true
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
      - sdk: UserNotifications.framework
      - sdk: AVKit.framework

  # ─── Layer 1: DeviceActivityReport Extension ─────────────────────────────────
  # Reads ActivitySegment.longestActivity — the most direct continuous-use signal.
  DeviceActivityReport:
    type: app-extension
    platform: iOS
    sources:
      - path: DeviceActivityReport
        excludes: ["**/*.entitlements"]
      - path: Shared
    entitlements:
      path: DeviceActivityReport/DeviceActivityReport.entitlements
    info:
      path: DeviceActivityReport/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eyebreak.app.report
        INFOPLIST_FILE: DeviceActivityReport/Info.plist
        CODE_SIGN_ENTITLEMENTS: DeviceActivityReport/DeviceActivityReport.entitlements
    dependencies:
      - sdk: DeviceActivity.framework
      - sdk: SwiftUI.framework

  # ─── Layer 2 & 3: DeviceActivityMonitor Extension ────────────────────────────
  # Layer 2: short-window streak counting
  # Layer 3: daily total threshold
  DeviceActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: DeviceActivityMonitor
        excludes: ["**/*.entitlements"]
      - path: Shared
    entitlements:
      path: DeviceActivityMonitor/DeviceActivityMonitor.entitlements
    info:
      path: DeviceActivityMonitor/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eyebreak.app.monitor
        INFOPLIST_FILE: DeviceActivityMonitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: DeviceActivityMonitor/DeviceActivityMonitor.entitlements
    dependencies:
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
      - sdk: UserNotifications.framework

  # ─── ShieldConfiguration Extension ──────────────────────────────────────────
  ShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldConfiguration
        excludes: ["**/*.entitlements"]
      - path: Shared
    entitlements:
      path: ShieldConfiguration/ShieldConfiguration.entitlements
    info:
      path: ShieldConfiguration/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eyebreak.app.shieldconfig
        INFOPLIST_FILE: ShieldConfiguration/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShieldConfiguration/ShieldConfiguration.entitlements
    dependencies:
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework

  # ─── ShieldAction Extension ───────────────────────────────────────────────────
  ShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldAction
        excludes: ["**/*.entitlements"]
      - path: Shared
    entitlements:
      path: ShieldAction/ShieldAction.entitlements
    info:
      path: ShieldAction/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eyebreak.app.shieldaction
        INFOPLIST_FILE: ShieldAction/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShieldAction/ShieldAction.entitlements
    dependencies:
      - sdk: ManagedSettings.framework
