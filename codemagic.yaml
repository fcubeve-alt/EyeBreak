workflows:
  ios-build:
    name: EyeBreak iOS Build (compile check)
    max_build_duration: 30
    environment:
      xcode: 16.2
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen --quiet
      - name: Generate Xcode project
        working_directory: EyeBreak
        script: xcodegen generate
      - name: Build
        working_directory: EyeBreak
        script: |
          xcodebuild build \
            -project EyeBreak.xcodeproj \
            -scheme EyeBreak \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""
    artifacts:
      - EyeBreak/build/**/*.app
