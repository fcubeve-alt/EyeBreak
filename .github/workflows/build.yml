name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # 在模拟器里跑起来并截图。Family Controls 在模拟器不可用，
  # 但护眼引导界面（Kill Test #2 的验收对象）不依赖任何权限，可以直接验收。
  preview:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen --quiet

      - name: Generate Xcode project
        working-directory: EyeBreak
        run: xcodegen generate

      - name: Build for simulator
        working-directory: EyeBreak
        run: |
          xcodebuild build \
            -project EyeBreak.xcodeproj \
            -scheme EyeBreak \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO

      - name: Launch and capture screenshots
        working-directory: EyeBreak
        run: |
          set -euo pipefail
          mkdir -p shots
          APP=$(find dd/Build/Products -type d -name "EyeBreak.app" -path "*iphonesimulator*" | head -1)
          test -n "$APP" || { echo "::error::simulator app not built"; exit 1; }
          echo "app: $APP"

          # runner 上具体有哪些机型/系统会变，动态挑一个 iPhone，不写死名字
          DEVTYPE=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; d=[x for x in json.load(sys.stdin)['devicetypes'] if 'iPhone' in x['name']]; print(d[-1]['identifier'])")
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['isAvailable'] and x['platform']=='iOS']; print(r[-1]['identifier'])")
          echo "devicetype: $DEVTYPE"
          echo "runtime:    $RUNTIME"

          UDID=$(xcrun simctl create eyebreak-preview "$DEVTYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

          xcrun simctl install "$UDID" "$APP"

          # 1) 主界面
          xcrun simctl launch "$UDID" com.eyebreak.app
          sleep 6
          xcrun simctl io "$UDID" screenshot shots/1-main.png

          # 2) 护眼引导界面（含视频入口）
          xcrun simctl terminate "$UDID" com.eyebreak.app || true
          xcrun simctl launch "$UDID" com.eyebreak.app -EyeBreakDemo
          sleep 8
          xcrun simctl io "$UDID" screenshot shots/2-break-prompt.png

          xcrun simctl shutdown "$UDID" || true
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eyebreak-screenshots
          path: EyeBreak/shots/*.png
          if-no-files-found: warn

  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen --quiet

      - name: Generate Xcode project
        working-directory: EyeBreak
        run: xcodegen generate

      # XcodeGen 的 info: / entitlements: 键是「生成」语义，会覆盖仓库里手写的文件。
      # 一旦发生，扩展照样编译通过，但 NSExtensionPointIdentifier 和 Family Controls
      # 权限全部丢失，真机上表现为「装得上、什么都不触发」，极难排查。
      # 这一步在生成之后断言这些关键内容仍然存在。
      - name: Verify extension plists and entitlements survived generation
        working-directory: EyeBreak
        run: |
          set -euo pipefail
          fail=0

          check_extension_point () {
            file="$1"; expected="$2"
            got=$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$file" 2>/dev/null || echo MISSING)
            if [ "$got" != "$expected" ]; then
              echo "::error file=$file::NSExtensionPointIdentifier is '$got', expected '$expected'"
              fail=1
            else
              echo "ok   $file -> $got"
            fi
          }

          check_extension_point DeviceActivityReport/Info.plist  com.apple.deviceactivity.report
          check_extension_point DeviceActivityMonitor/Info.plist com.apple.deviceactivity.monitor
          check_extension_point ShieldConfiguration/Info.plist   com.apple.ManagedSettings.ShieldConfigurationExtension
          check_extension_point ShieldAction/Info.plist          com.apple.ManagedSettings.ShieldActionExtension

          for f in EyeBreak/EyeBreak.entitlements \
                   DeviceActivityReport/DeviceActivityReport.entitlements \
                   DeviceActivityMonitor/DeviceActivityMonitor.entitlements \
                   ShieldConfiguration/ShieldConfiguration.entitlements \
                   ShieldAction/ShieldAction.entitlements; do
            if ! /usr/libexec/PlistBuddy -c "Print :com.apple.developer.family-controls" "$f" >/dev/null 2>&1; then
              echo "::error file=$f::missing com.apple.developer.family-controls"
              fail=1
            elif ! /usr/libexec/PlistBuddy -c "Print :com.apple.security.application-groups:0" "$f" >/dev/null 2>&1; then
              echo "::error file=$f::missing App Group"
              fail=1
            else
              echo "ok   $f"
            fi
          done

          exit $fail

      - name: Build (compile check — signing disabled)
        working-directory: EyeBreak
        run: |
          xcodebuild build \
            -project EyeBreak.xcodeproj \
            -scheme EyeBreak \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      # 编译通过不代表资源和扩展真的进了 App 包，这里逐项断言产物。
      - name: Verify app bundle contents
        run: |
          set -euo pipefail
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "EyeBreak.app" -path "*Debug-iphoneos*" | head -1)
          test -n "$APP" || { echo "::error::EyeBreak.app not found"; exit 1; }
          echo "app bundle: $APP"
          fail=0

          if [ -f "$APP/eye_exercise.mp4" ]; then
            echo "ok   eye_exercise.mp4 ($(du -h "$APP/eye_exercise.mp4" | cut -f1))"
          else
            echo "::error::eye_exercise.mp4 missing from app bundle"
            fail=1
          fi

          for ext in DeviceActivityReport DeviceActivityMonitor ShieldConfiguration ShieldAction; do
            if [ -d "$APP/PlugIns/$ext.appex" ]; then
              echo "ok   $ext.appex embedded"
            else
              echo "::error::$ext.appex not embedded"
              fail=1
            fi
          done

          exit $fail
